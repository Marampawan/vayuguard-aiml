<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Extended Forecast — VayuGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      /* Dark High-Tech Modern Background */
      body {
        background: #090d16 !important;
        color: #f8fafc !important;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
      }

      /* High-Contrast Search Input Bar & Placeholder Fix */
      .search-input-custom,
      input[type="text"] {
        background-color: rgba(30, 41, 59, 0.9) !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.25) !important;
        font-weight: 500 !important;
      }

      .search-input-custom::placeholder,
      input[type="text"]::placeholder {
        color: #cbd5e1 !important; /* Bright Silver/White for full visibility */
        opacity: 1 !important;
      }

      .search-input-custom:focus,
      input[type="text"]:focus {
        background-color: rgba(30, 41, 59, 1) !important;
        color: #ffffff !important;
        border-color: #8b5cf6 !important;
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.5) !important;
      }

      /* Sleek Glassmorphic Card Base */
      .card-quantum-glass {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card-quantum-glass:hover {
        transform: translateY(-2px);
      }

      /* Dynamic AQI Color-Coded Badges & Glows */
      /* Good AQI (<= 50): Vibrant Green */
      .badge-aqi-good {
        background: rgba(16, 185, 129, 0.25) !important;
        color: #34d399 !important;
        border: 1px solid #10b981 !important;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
      }

      /* Moderate AQI (51 - 100): Vibrant Yellow / Amber */
      .badge-aqi-moderate {
        background: rgba(245, 158, 11, 0.25) !important;
        color: #fbbf24 !important;
        border: 1px solid #f59e0b !important;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
      }

      /* Unhealthy AQI (> 100): Bright Red / Coral */
      .badge-aqi-unhealthy {
        background: rgba(239, 68, 68, 0.25) !important;
        color: #f87171 !important;
        border: 1px solid #ef4444 !important;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
      }

      /* High-Contrast Tile Boxes */
      .tile-metric {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }

      /* Label Text Colors */
      .text-label-temp { color: #38bdf8 !important; }     /* Sky Blue */
      .text-label-sunrise { color: #fbbf24 !important; }  /* Bright Gold */
      .text-label-sunset { color: #fb7185 !important; }   /* Coral / Rose */
      .text-label-rain { color: #60a5fa !important; }     /* Rain Blue */
      .text-label-wind { color: #cbd5e1 !important; }     /* Bright Silver */
      .text-label-humidity { color: #c084fc !important; } /* Purple */

      /* Container Z-Index & Position Fix */
      .search-container-box {
        position: relative;
        z-index: 9999 !important; /* Forces dropdown above all forecast cards */
      }

      /* Clean Floating Autocomplete Suggestions Dropdown */
      .search-suggestions-dropdown, 
      #suggestions-list, 
      .autocomplete-results {
        position: absolute !important;
        top: 100% !important;
        left: 0;
        right: 0;
        z-index: 10000 !important;
        margin-top: 6px;
        background: rgba(18, 24, 38, 0.95) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(168, 85, 247, 0.3) !important;
        border-radius: 12px !important;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6) !important;
        max-height: 250px;
        overflow-y: auto;
        padding: 6px 0;
        list-style: none;
      }

      /* Suggestion Item Styling */
      .suggestion-item, 
      .autocomplete-item {
        padding: 10px 16px;
        color: #e2e8f0;
        font-size: 0.92rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .suggestion-item:hover, 
      .autocomplete-item:hover {
        background: rgba(168, 85, 247, 0.2) !important;
        color: #ffffff;
      }

      /* Ensure search wrapper doesn't clip the dropdown */
      .input-group, .search-container-box {
        position: relative !important;
        overflow: visible !important;
        z-index: 9999 !important;
      }

      /* Floating Autocomplete Dropdown Styling */
      .autocomplete-suggestions-box {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 10000;
        margin-top: 6px;
        background: rgba(18, 24, 38, 0.95);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(168, 85, 247, 0.35);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        max-height: 220px;
        overflow-y: auto;
        padding: 6px 0;
      }

      /* Individual Suggestion Items */
      .suggestion-item {
        padding: 10px 16px;
        color: #f1f5f9;
        font-size: 0.95rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .suggestion-item:hover {
        background: rgba(168, 85, 247, 0.25);
        color: #ffffff;
      }
    </style>
</head>
<body class="py-4 py-md-5">

    <div class="container" style="max-width: 980px;">
        
        <!-- 7-DAY EXTENDED FORECAST HEADER WITH LOCATION SEARCH -->
        <div class="card card-quantum-glass p-4 shadow rounded-4 mb-3">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                <div>
                    <h2 class="fw-bold m-0 d-flex align-items-center gap-2 text-white">
                        <i class="fas fa-calendar-week" style="color: #8b5cf6;"></i>
                        <span>7-Day Extended Forecast</span>
                    </h2>
                    <p class="small m-0 mt-1" style="color: #94a3b8;">
                        Active Location: <strong id="current-location-label" style="color: #22d3ee;">Bengaluru, IN</strong>
                    </p>
                </div>
                <a href="forecast.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fas fa-arrow-left me-1"></i> Dashboard
                </a>
            </div>

            <!-- Search Box Section -->
            <div class="search-container-box" style="position: relative; z-index: 9999; overflow: visible;">
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-purple"><i class="fas fa-map-marker-alt"></i></span>
                <input type="text" 
                       id="forecast-search-input" 
                       class="form-control bg-dark text-light border-secondary" 
                       placeholder="Search city..." 
                       autocomplete="off">
                <button id="update-forecast-btn" class="btn btn-purple">Update Forecast</button>
              </div>
              
              <!-- Suggestions container (will now float on top) -->
              <div id="suggestions-dropdown" class="search-suggestions-dropdown" style="display: none;"></div>
            </div>
        </div>

        <!-- DYNAMIC 7-DAY EXTENDED FORECAST CONTAINER -->
        <div id="forecast-cards-wrapper">
            <div class="text-center py-5" style="color: #64748b;">
                <i class="fas fa-atom fa-spin fa-2x mb-3" style="color: #7209b7;"></i>
                <p>Loading live quantum-corrected forecast...</p>
            </div>
        </div>
    </div>

    <script>
  document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('forecast-search-input') || document.querySelector('input[placeholder*="Delhi"]');
    const searchContainer = searchInput?.parentElement;

    if (!searchInput || !searchContainer) return;

    // Create suggestion dropdown element if it doesn't exist
    let dropdown = document.getElementById('autocomplete-dropdown');
    if (!dropdown) {
      dropdown = document.createElement('div');
      dropdown.id = 'autocomplete-dropdown';
      dropdown.className = 'autocomplete-suggestions-box';
      searchContainer.style.position = 'relative';
      searchContainer.appendChild(dropdown);
    }

    let debounceTimer;

    // Listen to real-time input typing ("del" -> "Delhi")
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      clearTimeout(debounceTimer);

      if (query.length < 2) {
        dropdown.style.display = 'none';
        return;
      }

      // Debounce API calls by 250ms
      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=5`);
          const cities = await res.json();

          if (!cities || cities.length === 0) {
            dropdown.style.display = 'none';
            return;
          }

          // Build clean suggestion items
          dropdown.innerHTML = cities.map(city => {
            const name = city.display_name.split(',')[0];
            const country = city.address?.country || '';
            return `<div class="suggestion-item" data-lat="${city.lat}" data-lon="${city.lon}" data-name="${name}">
                      <i class="fas fa-map-marker-alt text-purple me-2"></i>
                      <strong>${name}</strong> <small style="color:#94a3b8; margin-left:6px;">${country}</small>
                    </div>`;
          }).join('');

          dropdown.style.display = 'block';

          // Handle click on suggestion item
          dropdown.querySelectorAll('.suggestion-item').forEach(item => {
            item.addEventListener('click', () => {
              const selectedName = item.getAttribute('data-name');
              searchInput.value = selectedName;
              dropdown.style.display = 'none';
              
              // Trigger forecast update
              if (typeof fetchDynamic7DayForecast === 'function') {
                fetchDynamic7DayForecast(parseFloat(item.getAttribute('data-lat')), parseFloat(item.getAttribute('data-lon')), selectedName);
              }
            });
          });

        } catch (err) {
          console.error("Autocomplete fetch error:", err);
        }
      }, 250);
    });

    // Close dropdown on click outside
    document.addEventListener('click', (e) => {
      if (!searchContainer.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });
  });
</script>
</body>
</html>
