<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Extended Forecast — VayuGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0e17;
            --card-bg: rgba(21, 29, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-purple: #9d4edd;
            --accent-blue: #4cc9f0;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(157, 78, 221, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            padding: 1.5rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(76, 201, 240, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .param-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 0.75rem 0.5rem;
        }

        .param-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 0.35rem;
        }

        .aqi-pill {
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
        }

        .aqi-good {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.35);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.15);
        }

        .aqi-moderate {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
        }

        .btn-dash {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            border-radius: 9999px;
            padding: 0.55rem 1.4rem;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .btn-dash:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.25);
        }

        .joke-box {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.15), rgba(0, 242, 254, 0.08));
            border: 1px dashed rgba(157, 78, 221, 0.4);
            border-radius: 18px;
        }
    </style>
</head>
<body class="py-4 py-md-5">

    <div class="container" style="max-width: 980px;">
        
        <!-- 7-DAY EXTENDED FORECAST HEADER WITH LOCATION SEARCH -->
        <div class="card card-custom text-light p-4 shadow rounded-4 mb-4" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                <div>
                    <h2 class="fw-bold text-white m-0 d-flex align-items-center gap-2">
                        <i class="fas fa-calendar-week text-purple" style="color: #c77dff;"></i>
                        <span>7-Day Extended Forecast</span>
                    </h2>
                    <p class="text-white-50 small m-0 mt-1">
                        Active Location: <strong id="current-location-label" class="text-info">Bengaluru, IN</strong>
                    </p>
                </div>
                <a href="forecast.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fas fa-arrow-left me-1"></i> Dashboard
                </a>
            </div>

            <!-- LOCATION SEARCH INPUT WITH LIVE AUTO-COMPLETE -->
            <div class="position-relative">
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-white-50">
                        <i class="fas fa-map-marker-alt text-danger"></i>
                    </span>
                    <input type="text" 
                           id="details-location-input" 
                           class="form-control bg-dark text-white border-secondary" 
                           placeholder="Enter city to change location (e.g., Mumbai, Delhi, Hyderabad)..." 
                           autocomplete="off" 
                           oninput="onTypeDetailsSearch(this.value)"
                           onkeypress="if(event.key==='Enter') searchDetailsLocation()">
                    <button class="btn btn-purple text-white fw-semibold px-4" 
                            style="background: linear-gradient(135deg, #7209b7, #8a2be2);" 
                            onclick="searchDetailsLocation()">
                        Update Forecast
                    </button>
                </div>

                <!-- Dropdown Menu for Auto-Complete Suggestions -->
                <ul id="details-suggestions-list" 
                    class="dropdown-menu dropdown-menu-dark w-100 shadow-lg border-secondary position-absolute" 
                    style="display: none; top: 100%; z-index: 1000; max-height: 220px; overflow-y: auto;"></ul>
            </div>
        </div>

        <!-- DYNAMIC 7-DAY EXTENDED FORECAST CONTAINER -->
        <div id="forecast-cards-wrapper">
            <div class="text-center py-5 text-white-50">
                <i class="fas fa-atom fa-spin fa-2x mb-3 text-purple"></i>
                <p>Loading live quantum-corrected forecast...</p>
            </div>
        </div>
    </div>

    <script>
        // Dynamic Date & Telemetry Script
        document.addEventListener("DOMContentLoaded", function() {
            // Detect live position on load or fallback to coordinates
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchDynamic7DayForecast(pos.coords.latitude, pos.coords.longitude, "Your Location"),
                    () => fetchDynamic7DayForecast(12.9716, 77.5946, "Bengaluru")
                );
            } else {
                fetchDynamic7DayForecast(12.9716, 77.5946, "Bengaluru");
            }
        });

        // Typing Auto-Complete Suggestions for Details Page (India-First Preference)
        let detailsDebounceTimer;
        function onTypeDetailsSearch(query) {
            clearTimeout(detailsDebounceTimer);
            const suggestionsList = document.getElementById('details-suggestions-list');

            if (!query || query.trim().length < 2) {
                if (suggestionsList) suggestionsList.style.display = 'none';
                return;
            }

            detailsDebounceTimer = setTimeout(async () => {
                let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=5`;
                
                try {
                    let response = await fetch(url);
                    let data = await response.json();

                    if (!data || data.length === 0) {
                        url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
                        response = await fetch(url);
                        data = await response.json();
                    }

                    if (suggestionsList) {
                        suggestionsList.innerHTML = '';
                        if (data && data.length > 0) {
                            data.forEach(place => {
                                const li = document.createElement('li');
                                li.className = 'dropdown-item text-truncate py-2 px-3 border-bottom border-secondary border-opacity-25';
                                li.style.cursor = 'pointer';
                                li.innerHTML = `<i class="fas fa-map-marker-alt text-info me-2"></i><strong>${place.display_name}</strong>`;
                                
                                li.onclick = () => {
                                    document.getElementById('details-location-input').value = place.display_name.split(',')[0];
                                    suggestionsList.style.display = 'none';
                                    fetchDynamic7DayForecast(parseFloat(place.lat), parseFloat(place.lon), place.display_name.split(',')[0]);
                                };
                                suggestionsList.appendChild(li);
                            });
                            suggestionsList.style.display = 'block';
                        } else {
                            suggestionsList.style.display = 'none';
                        }
                    }
                } catch (err) {
                    console.error('Suggestions error:', err);
                }
            }, 250);
        }

        // Search Location Handler
        async function searchDetailsLocation() {
            const input = document.getElementById('details-location-input');
            if (!input || !input.value.trim()) return;

            const query = input.value.trim();
            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=1`);
                let data = await res.json();

                if (!data || data.length === 0) {
                    res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                    data = await res.json();
                }

                if (data && data.length > 0) {
                    const cityName = data[0].display_name.split(',')[0];
                    fetchDynamic7DayForecast(parseFloat(data[0].lat), parseFloat(data[0].lon), cityName);
                } else {
                    alert("Location not found.");
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        async function fetchDynamic7DayForecast(lat, lon, cityName) {
            const wrapper = document.getElementById('forecast-cards-wrapper');
            const locationLabel = document.getElementById('current-location-label');
            if (locationLabel) locationLabel.innerText = `${cityName}, IN`;

            try {
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,relative_humidity_2m_max,wind_speed_10m_max,precipitation_probability_max&timezone=auto`;
                const weatherRes = await fetch(weatherUrl);
                const weatherData = await weatherRes.json();

                const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

                let cardsHTML = '';

                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    const dateStr = `${daysOfWeek[d.getDay()]}, ${months[d.getMonth()]} ${String(d.getDate()).padStart(2, '0')}`;

                    const tempMax = Math.round(weatherData.daily?.temperature_2m_max?.[i] ?? 28);
                    const tempMin = Math.round(weatherData.daily?.temperature_2m_min?.[i] ?? 22);
                    const rain = weatherData.daily?.precipitation_probability_max?.[i] ?? 15;
                    const wind = weatherData.daily?.wind_speed_10m_max?.[i] ?? 20;
                    const humidity = weatherData.daily?.relative_humidity_2m_max?.[i] ?? 70;

                    const rawSunrise = weatherData.daily?.sunrise?.[i];
                    const rawSunset = weatherData.daily?.sunset?.[i];
                    const sunriseTime = rawSunrise ? new Date(rawSunrise).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '06:05 AM';
                    const sunsetTime = rawSunset ? new Date(rawSunset).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '06:45 PM';

                    // Sync Day 0 with live telemetry; execute Quantum Predictions for upcoming days
                    let dayAqi;
                    if (i === 0) {
                        // Force Day 0 to pull current live telemetry to match main dashboard
                        const liveAqiRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`);
                        const liveAqiData = await liveAqiRes.json();
                        dayAqi = liveAqiData.current?.us_aqi || 50;
                    } else {
                        // Run Quantum Prediction on Railway backend for Days 1-6
                        const qRes = await fetch(`https://vayuguard-aiml-production.up.railway.app/predict-quantum?temp=${tempMax}&humidity=${humidity}&wind=${wind}&day_index=${i}`);
                        const qData = await qRes.json();
                        dayAqi = qData.quantum_aqi;
                    }

                    let status = dayAqi <= 50 ? "Good" : dayAqi <= 100 ? "Moderate" : "Unhealthy";
                    let statusClass = dayAqi <= 50 ? "bg-success text-success" : dayAqi <= 100 ? "bg-warning text-warning" : "bg-danger text-danger";

                    cardsHTML += `
                        <div class="card card-custom text-light p-4 shadow rounded-4 border border-secondary border-opacity-25 mb-3" style="background: rgba(255, 255, 255, 0.03);">
                            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                                <div class="d-flex align-items-center gap-2">
                                    ${i === 0 ? '<span class="badge bg-purple text-white rounded-pill px-2.5 py-1 small fw-bold" style="background: #7209b7;">TODAY</span>' : ''}
                                    <h4 class="fw-bold m-0 text-white">${dateStr}</h4>
                                </div>
                                <span class="badge ${statusClass} bg-opacity-25 border border-opacity-25 px-3 py-1.5 rounded-pill fw-semibold">
                                    ● AQI ${dayAqi} • ${status}
                                </span>
                            </div>

                            <div class="row g-2 text-white-50 small">
                                <div class="col-6 col-md-2">
                                    <div class="p-2.5 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-10">
                                        <span class="d-block text-info small"><i class="fas fa-thermometer-half me-1"></i> TEMP</span>
                                        <strong class="text-white fs-6">${tempMin}°C / ${tempMax}°C</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="p-2.5 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-10">
                                        <span class="d-block text-warning small"><i class="fas fa-sun me-1"></i> SUNRISE</span>
                                        <strong class="text-white fs-6">${sunriseTime}</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="p-2.5 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-10">
                                        <span class="d-block text-danger small"><i class="fas fa-moon me-1"></i> SUNSET</span>
                                        <strong class="text-white fs-6">${sunsetTime}</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="p-2.5 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-10">
                                        <span class="d-block text-primary small"><i class="fas fa-cloud-rain me-1"></i> RAIN</span>
                                        <strong class="text-white fs-6">${Math.round(rain)}%</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="p-2.5 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-10">
                                        <span class="d-block text-white-50 small"><i class="fas fa-wind me-1"></i> WIND</span>
                                        <strong class="text-white fs-6">${Math.round(wind)} km/h</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="p-2.5 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-10">
                                        <span class="d-block text-purple small" style="color: #c77dff;"><i class="fas fa-tint me-1"></i> HUMIDITY</span>
                                        <strong class="text-white fs-6">${Math.round(humidity)}%</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (wrapper) wrapper.innerHTML = cardsHTML;

            } catch (err) {
                console.error("Forecast fetch error:", err);
            }
        }

        // Close suggestions menu when clicking outside
        document.addEventListener('click', function(e) {
            const suggestionsList = document.getElementById('details-suggestions-list');
            const searchInput = document.getElementById('details-location-input');
            if (suggestionsList && searchInput && !searchInput.contains(e.target)) {
                suggestionsList.style.display = 'none';
            }
        });
    </script>
</body>
</html>
