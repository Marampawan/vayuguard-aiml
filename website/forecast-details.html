<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Extended Forecast — VayuGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      /* Dark High-Tech Modern Background */
      body {
        background: #090d16 !important;
        color: #f8fafc !important;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
      }

      /* High-Contrast Search Input Bar & Placeholder Fix */
      .search-input-custom,
      input[type="text"] {
        background-color: rgba(30, 41, 59, 0.9) !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.25) !important;
        font-weight: 500 !important;
      }

      .search-input-custom::placeholder,
      input[type="text"]::placeholder {
        color: #cbd5e1 !important; /* Bright Silver/White for full visibility */
        opacity: 1 !important;
      }

      .search-input-custom:focus,
      input[type="text"]:focus {
        background-color: rgba(30, 41, 59, 1) !important;
        color: #ffffff !important;
        border-color: #8b5cf6 !important;
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.5) !important;
      }

      /* Sleek Glassmorphic Card Base */
      .card-quantum-glass {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card-quantum-glass:hover {
        transform: translateY(-2px);
      }

      /* Dynamic AQI Color-Coded Badges & Glows */
      /* Good AQI (<= 50): Vibrant Green */
      .badge-aqi-good {
        background: rgba(16, 185, 129, 0.25) !important;
        color: #34d399 !important;
        border: 1px solid #10b981 !important;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
      }

      /* Moderate AQI (51 - 100): Vibrant Yellow / Amber */
      .badge-aqi-moderate {
        background: rgba(245, 158, 11, 0.25) !important;
        color: #fbbf24 !important;
        border: 1px solid #f59e0b !important;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
      }

      /* Unhealthy AQI (> 100): Bright Red / Coral */
      .badge-aqi-unhealthy {
        background: rgba(239, 68, 68, 0.25) !important;
        color: #f87171 !important;
        border: 1px solid #ef4444 !important;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
      }

      /* High-Contrast Tile Boxes */
      .tile-metric {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }

      /* Label Text Colors */
      .text-label-temp { color: #38bdf8 !important; }     /* Sky Blue */
      .text-label-sunrise { color: #fbbf24 !important; }  /* Bright Gold */
      .text-label-sunset { color: #fb7185 !important; }   /* Coral / Rose */
      .text-label-rain { color: #60a5fa !important; }     /* Rain Blue */
      .text-label-wind { color: #cbd5e1 !important; }     /* Bright Silver */
      .text-label-humidity { color: #c084fc !important; } /* Purple */
    </style>
</head>
<body class="py-4 py-md-5">

    <div class="container" style="max-width: 980px;">
        
        <!-- 7-DAY EXTENDED FORECAST HEADER WITH LOCATION SEARCH -->
        <div class="card card-quantum-glass p-4 shadow rounded-4 mb-3">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                <div>
                    <h2 class="fw-bold m-0 d-flex align-items-center gap-2 text-white">
                        <i class="fas fa-calendar-week" style="color: #8b5cf6;"></i>
                        <span>7-Day Extended Forecast</span>
                    </h2>
                    <p class="small m-0 mt-1" style="color: #94a3b8;">
                        Active Location: <strong id="current-location-label" style="color: #22d3ee;">Bengaluru, IN</strong>
                    </p>
                </div>
                <a href="forecast.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fas fa-arrow-left me-1"></i> Dashboard
                </a>
            </div>

            <!-- LOCATION SEARCH INPUT WITH LIVE AUTO-COMPLETE -->
            <div class="position-relative">
                <div class="input-group">
                    <span class="input-group-text" style="background: rgba(30, 41, 59, 0.5); border-color: rgba(255, 255, 255, 0.1); color: #94a3b8;">
                        <i class="fas fa-map-marker-alt" style="color: #f87171;"></i>
                    </span>
                    <input type="text" 
                           id="details-location-input" 
                           class="form-control search-input-custom" 
                           placeholder="Enter city to change location (e.g., Mumbai, Delhi, Hyderabad)..." 
                           autocomplete="off" 
                           oninput="onTypeDetailsSearch(this.value)"
                           onkeypress="if(event.key==='Enter') searchDetailsLocation()">
                    <button class="btn text-white fw-semibold px-4" 
                            style="background: linear-gradient(135deg, #8b5cf6, #6366f1);" 
                            onclick="searchDetailsLocation()">
                        Update Forecast
                    </button>
                </div>

                <!-- Dropdown Menu for Auto-Complete Suggestions -->
                <ul id="details-suggestions-list" 
                    class="dropdown-menu w-100 shadow-lg border position-absolute" 
                    style="display: none; top: 100%; z-index: 1000; max-height: 220px; overflow-y: auto; background: #1e293b; border-color: rgba(255, 255, 255, 0.1);"></ul>
            </div>
        </div>

        <!-- DYNAMIC 7-DAY EXTENDED FORECAST CONTAINER -->
        <div id="forecast-cards-wrapper">
            <div class="text-center py-5" style="color: #64748b;">
                <i class="fas fa-atom fa-spin fa-2x mb-3" style="color: #7209b7;"></i>
                <p>Loading live quantum-corrected forecast...</p>
            </div>
        </div>
    </div>

    <script>
        // Dynamic Date & Telemetry Script
        document.addEventListener("DOMContentLoaded", function() {
            // Detect live position on load or fallback to coordinates
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchDynamic7DayForecast(pos.coords.latitude, pos.coords.longitude, "Your Location"),
                    () => fetchDynamic7DayForecast(12.9716, 77.5946, "Bengaluru")
                );
            } else {
                fetchDynamic7DayForecast(12.9716, 77.5946, "Bengaluru");
            }
        });

        // Typing Auto-Complete Suggestions for Details Page (India-First Preference)
        let detailsDebounceTimer;
        function onTypeDetailsSearch(query) {
            clearTimeout(detailsDebounceTimer);
            const suggestionsList = document.getElementById('details-suggestions-list');

            if (!query || query.trim().length < 2) {
                if (suggestionsList) suggestionsList.style.display = 'none';
                return;
            }

            detailsDebounceTimer = setTimeout(async () => {
                let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=5`;
                
                try {
                    let response = await fetch(url);
                    let data = await response.json();

                    if (!data || data.length === 0) {
                        url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
                        response = await fetch(url);
                        data = await response.json();
                    }

                    if (suggestionsList) {
                        suggestionsList.innerHTML = '';
                        if (data && data.length > 0) {
                            data.forEach(place => {
                                const li = document.createElement('li');
                                li.className = 'dropdown-item text-truncate py-2 px-3 border-bottom border-secondary border-opacity-25';
                                li.style.cursor = 'pointer';
                                li.innerHTML = `<i class="fas fa-map-marker-alt text-info me-2"></i><strong>${place.display_name}</strong>`;
                                
                                li.onclick = () => {
                                    document.getElementById('details-location-input').value = place.display_name.split(',')[0];
                                    suggestionsList.style.display = 'none';
                                    fetchDynamic7DayForecast(parseFloat(place.lat), parseFloat(place.lon), place.display_name.split(',')[0]);
                                };
                                suggestionsList.appendChild(li);
                            });
                            suggestionsList.style.display = 'block';
                        } else {
                            suggestionsList.style.display = 'none';
                        }
                    }
                } catch (err) {
                    console.error('Suggestions error:', err);
                }
            }, 250);
        }

        // Search Location Handler
        async function searchDetailsLocation() {
            const input = document.getElementById('details-location-input');
            if (!input || !input.value.trim()) return;

            const query = input.value.trim();
            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=1`);
                let data = await res.json();

                if (!data || data.length === 0) {
                    res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                    data = await res.json();
                }

                if (data && data.length > 0) {
                    const cityName = data[0].display_name.split(',')[0];
                    fetchDynamic7DayForecast(parseFloat(data[0].lat), parseFloat(data[0].lon), cityName);
                } else {
                    alert("Location not found.");
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        async function fetchDynamic7DayForecast(lat, lon, cityName) {
            const wrapper = document.getElementById('forecast-cards-wrapper');
            const locationLabel = document.getElementById('current-location-label');
            if (locationLabel) locationLabel.innerText = `${cityName}, IN`;

            try {
                // 1. Fetch real weather telemetry from Open-Meteo as base parameters
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,relative_humidity_2m_max,wind_speed_10m_max,precipitation_probability_max&timezone=Asia%2FKolkata`;
                const weatherRes = await fetch(weatherUrl);
                const weatherData = await weatherRes.json();

                const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

                let cardsHTML = '';

                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    const dateStr = `${daysOfWeek[d.getDay()]}, ${months[d.getMonth()]} ${String(d.getDate()).padStart(2, '0')}`;

                    let tempMax = Math.round(weatherData.daily?.temperature_2m_max?.[i] ?? 28);
                    let tempMin = Math.round(weatherData.daily?.temperature_2m_min?.[i] ?? 22);
                    let rain = Math.round(weatherData.daily?.precipitation_probability_max?.[i] ?? 15);
                    let wind = Math.round(weatherData.daily?.wind_speed_10m_max?.[i] ?? 20);
                    let humidity = Math.round(weatherData.daily?.relative_humidity_2m_max?.[i] ?? 70);

                    const rawSunrise = weatherData.daily?.sunrise?.[i];
                    const rawSunset = weatherData.daily?.sunset?.[i];
                    let sunriseTime = rawSunrise ? new Date(rawSunrise).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '06:05 AM';
                    let sunsetTime = rawSunset ? new Date(rawSunset).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '06:45 PM';

                    // Query live Quantum AQI from Railway
                    let dayAqi = 37;
                    try {
                        const qRes = await fetch(`https://vayuguard-aiml-production.up.railway.app/predict-quantum?temp=${tempMax}&humidity=${humidity}&wind=${wind}&day_index=${i}`);
                        const qData = await qRes.json();
                        if (qData && qData.quantum_aqi) {
                            dayAqi = qData.quantum_aqi;
                        }
                    } catch (qErr) {
                        const theta = (tempMax / 50.0) * Math.PI;
                        dayAqi = Math.round(35 + (tempMax * 0.3) + (humidity * 0.08) + (Math.cos(theta) * 4) + (i * 0.5));
                    }

                    // Dynamic Color Logic based on AQI Value
                    let status = "Good";
                    let badgeClass = "badge-aqi-good";

                    if (dayAqi <= 50) {
                        status = "Good";
                        badgeClass = "badge-aqi-good"; // Bright Green
                    } else if (dayAqi <= 100) {
                        status = "Moderate";
                        badgeClass = "badge-aqi-moderate"; // Bright Yellow
                    } else {
                        status = "Unhealthy";
                        badgeClass = "badge-aqi-unhealthy"; // Bright Red
                    }

                    cardsHTML += `
                        <div class="card card-quantum-glass rounded-4 p-4 mb-3">
                            <!-- Header -->
                            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3 pb-2 border-bottom border-white border-opacity-10">
                                <div class="d-flex align-items-center gap-2">
                                    ${i === 0 ? '<span class="badge rounded-pill px-3 py-1.5 fs-7 fw-bold" style="background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #ffffff;">TODAY</span>' : ''}
                                    <h4 class="fw-bold m-0 text-white tracking-wide">${dateStr}</h4>
                                </div>
                                <span class="badge ${badgeClass} px-3.5 py-2 rounded-pill fw-bold fs-6 d-inline-flex align-items-center gap-2">
                                    <span style="font-size: 8px;">●</span> AQI ${dayAqi} • ${status}
                                </span>
                            </div>

                            <!-- Telemetry Metrics Grid -->
                            <div class="row g-2">
                                <div class="col-6 col-md-2">
                                    <div class="tile-metric">
                                        <span class="d-block text-label-temp small fw-bold mb-1"><i class="fas fa-thermometer-half me-1"></i> TEMP</span>
                                        <strong class="text-white fs-6 fw-bold">${tempMin}°C / ${tempMax}°C</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="tile-metric">
                                        <span class="d-block text-label-sunrise small fw-bold mb-1"><i class="fas fa-sun me-1"></i> SUNRISE</span>
                                        <strong class="text-white fs-6 fw-bold">${sunriseTime}</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="tile-metric">
                                        <span class="d-block text-label-sunset small fw-bold mb-1"><i class="fas fa-moon me-1"></i> SUNSET</span>
                                        <strong class="text-white fs-6 fw-bold">${sunsetTime}</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="tile-metric">
                                        <span class="d-block text-label-rain small fw-bold mb-1"><i class="fas fa-cloud-rain me-1"></i> RAIN</span>
                                        <strong class="text-white fs-6 fw-bold">${rain}%</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="tile-metric">
                                        <span class="d-block text-label-wind small fw-bold mb-1"><i class="fas fa-wind me-1"></i> WIND</span>
                                        <strong class="text-white fs-6 fw-bold">${wind} km/h</strong>
                                    </div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <div class="tile-metric">
                                        <span class="d-block text-label-humidity small fw-bold mb-1"><i class="fas fa-tint me-1"></i> HUMIDITY</span>
                                        <strong class="text-white fs-6 fw-bold">${humidity}%</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Render HTML and clear the loading spinner
                if (wrapper) wrapper.innerHTML = cardsHTML;

            } catch (err) {
                console.error("Forecast error:", err);
            }
        }
    </script>
</body>
</html>
