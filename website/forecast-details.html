<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Extended Forecast — VayuGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      /* Dark High-Tech Modern Background */
      body {
        background: #090d16 !important;
        color: #f8fafc !important;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
      }

      /* High-Contrast Search Input Bar & Placeholder Fix */
      .search-input-custom,
      input[type="text"] {
        background-color: rgba(30, 41, 59, 0.9) !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.25) !important;
        font-weight: 500 !important;
      }

      .search-input-custom::placeholder,
      input[type="text"]::placeholder {
        color: #cbd5e1 !important; /* Bright Silver/White for full visibility */
        opacity: 1 !important;
      }

      .search-input-custom:focus,
      input[type="text"]:focus {
        background-color: rgba(30, 41, 59, 1) !important;
        color: #ffffff !important;
        border-color: #8b5cf6 !important;
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.5) !important;
      }

      /* Sleek Glassmorphic Card Base */
      .card-quantum-glass {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card-quantum-glass:hover {
        transform: translateY(-2px);
      }

      /* Dynamic AQI Color-Coded Badges & Glows */
      /* Good AQI (<= 50): Vibrant Green */
      .badge-aqi-good {
        background: rgba(16, 185, 129, 0.25) !important;
        color: #34d399 !important;
        border: 1px solid #10b981 !important;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
      }

      /* Moderate AQI (51 - 100): Vibrant Yellow / Amber */
      .badge-aqi-moderate {
        background: rgba(245, 158, 11, 0.25) !important;
        color: #fbbf24 !important;
        border: 1px solid #f59e0b !important;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
      }

      /* Unhealthy AQI (> 100): Bright Red / Coral */
      .badge-aqi-unhealthy {
        background: rgba(239, 68, 68, 0.25) !important;
        color: #f87171 !important;
        border: 1px solid #ef4444 !important;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
      }

      /* High-Contrast Tile Boxes */
      .tile-metric {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }

      /* Label Text Colors */
      .text-label-temp { color: #38bdf8 !important; }     /* Sky Blue */
      .text-label-sunrise { color: #fbbf24 !important; }  /* Bright Gold */
      .text-label-sunset { color: #fb7185 !important; }   /* Coral / Rose */
      .text-label-rain { color: #60a5fa !important; }     /* Rain Blue */
      .text-label-wind { color: #cbd5e1 !important; }     /* Bright Silver */
      .text-label-humidity { color: #c084fc !important; } /* Purple */

      /* Ensure search wrapper positioning */
      .position-relative {
        position: relative !important;
        overflow: visible !important;
      }

      /* Floating Autocomplete Box */
      .autocomplete-suggestions-box {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 99999 !important;
        margin-top: 6px;
        background: rgba(18, 24, 38, 0.98);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(168, 85, 247, 0.4);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
        max-height: 220px;
        overflow-y: auto;
        padding: 6px 0;
      }

      /* Autocomplete Item */
      .autocomplete-item {
        padding: 10px 16px;
        color: #f1f5f9;
        font-size: 0.92rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        transition: background 0.2s ease;
      }

      .autocomplete-item:hover {
        background: rgba(168, 85, 247, 0.25);
        color: #ffffff;
      }

      /* Outline Purple Button */
      .btn-outline-purple {
        background: transparent !important;
        border: 1px solid #8b5cf6 !important;
        color: #a78bfa !important;
        transition: all 0.3s ease;
      }

      .btn-outline-purple:hover {
        background: rgba(139, 92, 246, 0.15) !important;
        border-color: #a78bfa !important;
        color: #c4b5fd !important;
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      }

      .btn-outline-purple:active {
        transform: scale(0.98);
      }

      /* Ensure New Eco Tip / Joke Button is Bright & Visible */
      #next-joke-btn {
        background: linear-gradient(135deg, #a855f7, #7e22ce) !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        font-weight: 700 !important;
        opacity: 1 !important;
        visibility: visible !important;
        cursor: pointer;
        transition: all 0.25s ease-in-out;
      }

      #next-joke-btn:hover {
        background: linear-gradient(135deg, #9333ea, #6b21a8) !important;
        color: #ffffff !important;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5) !important;
      }

      #next-joke-btn i {
        color: #ffffff !important;
      }
    </style>
</head>
<body class="py-4 py-md-5">

    <div class="container" style="max-width: 980px;">
        
        <!-- Top Navigation Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill text-light px-3">
            <i class="fas fa-arrow-left me-2"></i>Return to Main Dashboard
          </a>
        </div>

        <!-- Location Header & Integrated Search Bar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 bg-dark border border-secondary border-opacity-25 rounded-4 p-3 mb-4 shadow-sm">
          
          <!-- Active Location Title & Badge -->
          <div class="d-flex align-items-center gap-2">
            <i class="fas fa-map-marker-alt text-danger fs-5"></i>
            <span class="text-secondary fw-semibold">Active Location:</span>
            <h5 id="active-location-name" class="fw-bold text-light mb-0">Bengaluru, IN</h5>
          </div>

          <!-- Search Group with Button -->
          <div class="position-relative" style="min-width: 300px; max-width: 440px; flex-grow: 1;">
            <div class="input-group">
              <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-secondary">
                <i class="fas fa-search"></i>
              </span>
              <input 
                type="text" 
                id="forecast-search-input" 
                class="form-control bg-dark text-light border-secondary shadow-none" 
                placeholder="Type city (e.g., Delhi, Ongole)..." 
                autocomplete="off"
              >
              <button id="update-forecast-btn" class="btn btn-purple px-3">
                Search
              </button>
            </div>

            <!-- Autocomplete Dropdown List -->
            <div id="forecast-autocomplete-list" class="autocomplete-suggestions-box"></div>
          </div>
        </div>

        <!-- DYNAMIC 7-DAY EXTENDED FORECAST CONTAINER -->
        <div class="row g-4 mt-2" id="forecast-cards-container">
            <div class="text-center py-5" style="color: #64748b;">
                <i class="fas fa-atom fa-spin fa-2x mb-3" style="color: #7209b7;"></i>
                <p>Loading live quantum-corrected forecast...</p>
            </div>
        </div>

        <!-- Enhanced Mindful Hub & Daily Eco-Jokes Panel -->
        <div class="card bg-dark text-light border border-purple rounded-4 p-5 mt-5 shadow-lg position-relative overflow-hidden" style="background: linear-gradient(135deg, rgba(20, 26, 40, 0.95), rgba(35, 18, 55, 0.95)) !important; border: 1.5px solid rgba(168, 85, 247, 0.4) !important;">
          
          <!-- Glowing Background Accent -->
          <div style="position: absolute; top: -40px; right: -40px; width: 180px; height: 180px; background: rgba(168, 85, 247, 0.15); filter: blur(50px); border-radius: 50%; pointer-events: none;"></div>

          <div class="d-flex align-items-center gap-3 mb-4">
            <div class="bg-warning bg-opacity-25 rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 52px; height: 52px;">
              <i class="fas fa-smile-beam text-warning fs-3"></i>
            </div>
            <div>
              <h4 class="fw-bold mb-1 text-light">Mindful Hub & Air Quality Humour</h4>
              <small class="text-secondary">Daily Eco Insights & Quantum Wellness Tips</small>
            </div>
          </div>
          
          <div class="bg-dark bg-opacity-60 rounded-4 p-4 border border-secondary border-opacity-25 text-center shadow-inner my-2">
            <p id="eco-joke-text" class="fs-4 fw-medium text-light mb-0 py-3" style="font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; color: #f1f5f9 !important;">
              "AQI Tip: Keep windows closed during peak traffic hours (7-10 AM, 5-8 PM)!"
            </p>
          </div>

          <div class="text-center mt-3">
            <button id="next-joke-btn" class="btn btn-purple btn-lg rounded-pill px-4 py-2 shadow-lg fw-bold text-white">
              <i class="fas fa-sync-alt me-2 text-white"></i> New Eco Tip / Joke
            </button>
          </div>
        </div>
    </div>

    <script>
        // Disable native browser alert popups globally
        window.alert = function(msg) { console.warn("Blocked Alert Popup:", msg); };

        // Dynamic Date & Telemetry Script
        document.addEventListener("DOMContentLoaded", function() {
            // Detect live position on load or fallback to coordinates
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => load7DayForecast("Your Location", pos.coords.latitude, pos.coords.longitude),
                    () => load7DayForecast("Bengaluru", 12.9716, 77.5946)
                );
            } else {
                load7DayForecast("Bengaluru", 12.9716, 77.5946);
            }
        });

        // Typing Auto-Complete Suggestions for Details Page (India-First Preference)
        let detailsDebounceTimer;
        function onTypeDetailsSearch(query) {
            clearTimeout(detailsDebounceTimer);
            const suggestionsList = document.getElementById('details-suggestions-list');

            if (!query || query.trim().length < 2) {
                if (suggestionsList) suggestionsList.style.display = 'none';
                return;
            }

            detailsDebounceTimer = setTimeout(async () => {
                let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=5`;
                
                try {
                    let response = await fetch(url);
                    let data = await response.json();

                    if (!data || data.length === 0) {
                        url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
                        response = await fetch(url);
                        data = await response.json();
                    }

                    if (suggestionsList) {
                        suggestionsList.innerHTML = '';
                        if (data && data.length > 0) {
                            data.forEach(place => {
                                const li = document.createElement('li');
                                li.className = 'dropdown-item text-truncate py-2 px-3 border-bottom border-secondary border-opacity-25';
                                li.style.cursor = 'pointer';
                                li.innerHTML = `<i class="fas fa-map-marker-alt text-info me-2"></i><strong>${place.display_name}</strong>`;
                                
                                li.onclick = () => {
                                    document.getElementById('details-location-input').value = place.display_name.split(',')[0];
                                    suggestionsList.style.display = 'none';
                                    load7DayForecast(place.display_name.split(',')[0], parseFloat(place.lat), parseFloat(place.lon));
                                };
                                suggestionsList.appendChild(li);
                            });
                            suggestionsList.style.display = 'block';
                        } else {
                            suggestionsList.style.display = 'none';
                        }
                    }
                } catch (err) {
                    console.error('Suggestions error:', err);
                }
            }, 250);
        }

        // Search Location Handler
        async function searchDetailsLocation() {
            const input = document.getElementById('details-location-input');
            if (!input || !input.value.trim()) return;

            const query = input.value.trim();
            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=1`);
                let data = await res.json();

                if (!data || data.length === 0) {
                    res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                    data = await res.json();
                }

                if (data && data.length > 0) {
                    const cityName = data[0].display_name.split(',')[0];
                    load7DayForecast(cityName, parseFloat(data[0].lat), parseFloat(data[0].lon));
                } else {
                    alert("Location not found.");
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        }

        // Complete Working 7-Day Forecast Script (Configured for Railway Backend)
        async function load7DayForecast(cityName = "Bengaluru", lat = 12.9716, lon = 77.5946) {
          const activeLocHeader = document.getElementById('active-location-name');
          if (activeLocHeader) {
            activeLocHeader.innerText = cityName;
          }

          const cardsContainer = document.querySelector('.container .row.g-4') || document.getElementById('forecast-cards-container');
          if (!cardsContainer) return;

          try {
            // 1. Fetch Weather Telemetry from Open-Meteo
            const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,windspeed_10m_max,relative_humidity_2m_max,precipitation_probability_max,sunrise,sunset&timezone=auto`;
            const res = await fetch(apiUrl);
            if (!res.ok) throw new Error("Weather API fetch failed");
            const data = await res.json();

            const daily = data.daily;
            if (!daily || !daily.time) return;

            cardsContainer.innerHTML = ''; // Clear old forecast cards

            // 2. Loop & Render Fixed Daily Cards
            for (let idx = 0; idx < daily.time.length; idx++) {
              const dateStr = daily.time[idx];
              const maxTemp = Math.round(daily.temperature_2m_max[idx] ?? 28);
              const minTemp = Math.round(daily.temperature_2m_min[idx] ?? 20);
              const wind = Math.round(daily.windspeed_10m_max[idx] ?? 14);
              const hum = Math.round(daily.relative_humidity_2m_max[idx] ?? 65);
              const rain = Math.round(daily.precipitation_probability_max?.[idx] ?? 0);

              // Parse Sunrise / Sunset Times in Local Timezone
              const formatTime = (isoStr) => {
                if (!isoStr) return '--:--';
                const d = new Date(isoStr);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
              };

              const sunriseTime = formatTime(daily.sunrise?.[idx]);
              const sunsetTime = formatTime(daily.sunset?.[idx]);

              // 3. Optional Railway Quantum AQI Fetch (with fallback calculation)
              let calculatedAqi = Math.round(35 + (maxTemp * 0.35) + (wind * 0.15));
              try {
                const qRes = await fetch(`https://vayuguard-aiml-production.up.railway.app/predict-quantum?temp=${maxTemp}&humidity=${hum}&wind=${wind}&lat=${lat}&lon=${lon}`);
                if (qRes.ok) {
                  const qData = await qRes.json();
                  if (qData.quantum_aqi !== undefined) {
                    calculatedAqi = Math.round(qData.quantum_aqi);
                  }
                }
              } catch (qErr) {
                // Fallback to local calculation if Railway request times out
              }

              let statusStr = calculatedAqi <= 50 ? "Good" : calculatedAqi <= 100 ? "Moderate" : "Unhealthy";
              let badgeBg = calculatedAqi <= 50 ? "bg-success" : calculatedAqi <= 100 ? "bg-warning text-dark" : "bg-danger";

              const cardDate = new Date(dateStr).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: '2-digit' });
              const isToday = idx === 0;

              const cardHtml = `
                <div class="col-12 mb-3">
                  <div class="card bg-dark text-light border border-secondary border-opacity-25 rounded-4 p-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                      <div class="d-flex align-items-center gap-2">
                        ${isToday ? '<span class="badge bg-purple text-white px-2 py-1">TODAY</span>' : ''}
                        <h5 class="fw-bold mb-0 text-light">${cardDate}</h5>
                      </div>
                      <span class="badge ${badgeBg} fs-6 px-3 py-2">• AQI ${calculatedAqi} • ${statusStr}</span>
                    </div>

                    <div class="row g-2 text-center align-items-center">
                      <div class="col-6 col-md-2 bg-secondary bg-opacity-10 p-2 rounded-3">
                        <small class="text-info d-block fw-semibold"><i class="fas fa-thermometer-half me-1"></i> TEMP</small>
                        <strong class="fs-6">${minTemp}°C / ${maxTemp}°C</strong>
                      </div>
                      <div class="col-6 col-md-2 bg-secondary bg-opacity-10 p-2 rounded-3">
                        <small class="text-warning d-block fw-semibold"><i class="fas fa-sun me-1"></i> SUNRISE</small>
                        <strong class="fs-6">${sunriseTime}</strong>
                      </div>
                      <div class="col-6 col-md-2 bg-secondary bg-opacity-10 p-2 rounded-3">
                        <small class="text-danger d-block fw-semibold"><i class="fas fa-moon me-1"></i> SUNSET</small>
                        <strong class="fs-6">${sunsetTime}</strong>
                      </div>
                      <div class="col-6 col-md-2 bg-secondary bg-opacity-10 p-2 rounded-3">
                        <small class="text-primary d-block fw-semibold"><i class="fas fa-cloud-rain me-1"></i> RAIN</small>
                        <strong class="fs-6">${rain}%</strong>
                      </div>
                      <div class="col-6 col-md-2 bg-secondary bg-opacity-10 p-2 rounded-3">
                        <small class="text-cyan d-block fw-semibold"><i class="fas fa-wind me-1"></i> WIND</small>
                        <strong class="fs-6">${wind} km/h</strong>
                      </div>
                      <div class="col-6 col-md-2 bg-secondary bg-opacity-10 p-2 rounded-3">
                        <small class="text-purple d-block fw-semibold"><i class="fas fa-tint me-1"></i> HUMIDITY</small>
                        <strong class="fs-6">${hum}%</strong>
                      </div>
                    </div>
                  </div>
                </div>
              `;
              cardsContainer.insertAdjacentHTML('beforeend', cardHtml);
            }

          } catch (err) {
            console.error("Error updating 7-day forecast cards:", err);
          }
        }
    </script>

  <script>
    // Eco-Jokes & Air Quality Tips Array
    const ecoJokesAndTips = [
      "Why did the tree go to the dentist? To get a root canal before the AQI spiked!",
      "What do you call a fish wearing a mask? A safe-sea breather!",
      "Why don't air particles play hide and seek? Because good ventilation always seeks them out!",
      "Plant a tree today — it's the only filter that gives you free Wi-Fi (shade)!",
      "Why did the cyclist bring a plant to the race? To offset the carbon!",
      "AQI Tip: Indoor plants like Snake Plant and Peace Lily are natural air purifiers!",
      "Why did the cloud go to school? To get a little brighter!",
      "Fun Fact: One tree can absorb about 48 pounds of CO2 per year!",
      "Why don't smog particles ever win arguments? They're too full of hot air!",
      "Eco Tip: Walking 1 km instead of driving saves ~0.2 kg of CO2 emissions!",
      "What's a pollutant's favorite song? 'I Can't Breathe' by The Rolling Smog!",
      "Why did the solar panel go to art school? To learn how to capture light!",
      "AQI Tip: Keep windows closed during peak traffic hours (7-10 AM, 5-8 PM)!",
      "Why was the wind turbine always invited to parties? It was a real breeze!",
      "Fun Fact: Indoor air can be 2-5x more polluted than outdoor air!"
    ];

    // Mindful Hub - Joke Rotation Functionality
    function initEcoJokeRotator() {
      const jokeText = document.getElementById('eco-joke-text');
      const nextJokeBtn = document.getElementById('next-joke-btn');
      
      if (!jokeText || !nextJokeBtn) return;

      let currentJokeIndex = 0;

      // Function to display a random joke/tip
      const showRandomJoke = () => {
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * ecoJokesAndTips.length);
        } while (newIndex === currentJokeIndex && ecoJokesAndTips.length > 1);
        
        currentJokeIndex = newIndex;
        
        // Add fade effect
        jokeText.style.opacity = '0';
        jokeText.style.transition = 'opacity 0.3s ease';
        
        setTimeout(() => {
          jokeText.textContent = `"${ecoJokesAndTips[currentJokeIndex]}"`;
          jokeText.style.opacity = '1';
        }, 300);
      };

      // Add click event listener to button
      nextJokeBtn.addEventListener('click', showRandomJoke);

      // Optional: Auto-rotate jokes every 30 seconds
      setInterval(showRandomJoke, 30000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('forecast-search-input');
      const searchBtn = document.getElementById('update-forecast-btn');
      const dropdown = document.getElementById('forecast-autocomplete-list');
      let debounceTimer;

      if (!searchInput) return;
      
      // Initialize eco joke rotator
      initEcoJokeRotator();

      // 1. Fetch Nominatim Suggestions on Input ("del" -> Delhi)
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        clearTimeout(debounceTimer);

        if (query.length < 2) {
          if (dropdown) dropdown.style.display = 'none';
          return;
        }

        debounceTimer = setTimeout(async () => {
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=5`);
            const results = await res.json();

            if (!results || results.length === 0) {
              if (dropdown) dropdown.style.display = 'none';
              return;
            }

            if (dropdown) {
              dropdown.innerHTML = results.map(city => {
                const cityName = city.display_name.split(',')[0];
                const country = city.address?.country || '';
                return `
                  <div class="autocomplete-item" data-lat="${city.lat}" data-lon="${city.lon}" data-name="${cityName}">
                    <i class="fas fa-map-marker-alt text-purple me-2"></i>
                    <strong>${cityName}</strong> <small style="color: #94a3b8; margin-left:6px;">${country}</small>
                  </div>
                `;
              }).join('');

              dropdown.style.display = 'block';

              // Select item click
              dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
                item.addEventListener('click', () => {
                  const cityName = item.getAttribute('data-name');
                  const lat = item.getAttribute('data-lat');
                  const lon = item.getAttribute('data-lon');

                  searchInput.value = cityName;
                  dropdown.style.display = 'none';

                  // Call forecast updater
                  if (typeof load7DayForecast === 'function') {
                    load7DayForecast(cityName, lat, lon);
                  }
                });
              });
            }
          } catch (err) {
            console.error("Autocomplete fetch error:", err);
          }
        }, 200);
      });

      // 2. Execute Search on Button Click or Enter
      const runSearch = async () => {
        const cityQuery = searchInput.value.trim();
        if (!cityQuery) return;

        if (dropdown) dropdown.style.display = 'hide';

        try {
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityQuery)}`);
          const geoData = await geoRes.json();

          if (geoData && geoData.length > 0) {
            const cityName = geoData[0].display_name.split(',')[0];
            const lat = geoData[0].lat;
            const lon = geoData[0].lon;

            if (typeof load7DayForecast === 'function') {
              load7DayForecast(cityName, lat, lon);
            }
          } else {
            alert("City not found. Please try another location.");
          }
        } catch (err) {
          console.error("Geocoding search execution error:", err);
        }
      };

      if (searchBtn) searchBtn.addEventListener('click', runSearch);

      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') runSearch();
      });

      // Close dropdown on click outside
      document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !dropdown?.contains(e.target)) {
          if (dropdown) dropdown.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
