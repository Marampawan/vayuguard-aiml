<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Extended Forecast — VayuGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      /* Dark High-Tech Modern Background */
      body {
        background: #090d16 !important;
        color: #f8fafc !important;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif !important;
      }

      /* High-Contrast Search Input Bar & Placeholder Fix */
      .search-input-custom,
      input[type="text"] {
        background-color: rgba(30, 41, 59, 0.9) !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.25) !important;
        font-weight: 500 !important;
      }

      .search-input-custom::placeholder,
      input[type="text"]::placeholder {
        color: #cbd5e1 !important; /* Bright Silver/White for full visibility */
        opacity: 1 !important;
      }

      .search-input-custom:focus,
      input[type="text"]:focus {
        background-color: rgba(30, 41, 59, 1) !important;
        color: #ffffff !important;
        border-color: #8b5cf6 !important;
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.5) !important;
      }

      /* Sleek Glassmorphic Card Base */
      .card-quantum-glass {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card-quantum-glass:hover {
        transform: translateY(-2px);
      }

      /* Dynamic AQI Color-Coded Badges & Glows */
      /* Good AQI (<= 50): Vibrant Green */
      .badge-aqi-good {
        background: rgba(16, 185, 129, 0.25) !important;
        color: #34d399 !important;
        border: 1px solid #10b981 !important;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
      }

      /* Moderate AQI (51 - 100): Vibrant Yellow / Amber */
      .badge-aqi-moderate {
        background: rgba(245, 158, 11, 0.25) !important;
        color: #fbbf24 !important;
        border: 1px solid #f59e0b !important;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
      }

      /* Unhealthy AQI (> 100): Bright Red / Coral */
      .badge-aqi-unhealthy {
        background: rgba(239, 68, 68, 0.25) !important;
        color: #f87171 !important;
        border: 1px solid #ef4444 !important;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
      }

      /* High-Contrast Tile Boxes */
      .tile-metric {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }

      /* Label Text Colors */
      .text-label-temp { color: #38bdf8 !important; }     /* Sky Blue */
      .text-label-sunrise { color: #fbbf24 !important; }  /* Bright Gold */
      .text-label-sunset { color: #fb7185 !important; }   /* Coral / Rose */
      .text-label-rain { color: #60a5fa !important; }     /* Rain Blue */
      .text-label-wind { color: #cbd5e1 !important; }     /* Bright Silver */
      .text-label-humidity { color: #c084fc !important; } /* Purple */

      /* Container Z-Index & Position Fix */
      .search-container-box {
        position: relative;
        z-index: 9999 !important; /* Forces dropdown above all forecast cards */
      }

      /* Clean Floating Autocomplete Suggestions Dropdown */
      .search-suggestions-dropdown, 
      #suggestions-list, 
      .autocomplete-results {
        position: absolute !important;
        top: 100% !important;
        left: 0;
        right: 0;
        z-index: 10000 !important;
        margin-top: 6px;
        background: rgba(18, 24, 38, 0.95) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(168, 85, 247, 0.3) !important;
        border-radius: 12px !important;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6) !important;
        max-height: 250px;
        overflow-y: auto;
        padding: 6px 0;
        list-style: none;
      }

      /* Suggestion Item Styling */
      .suggestion-item, 
      .autocomplete-item {
        padding: 10px 16px;
        color: #e2e8f0;
        font-size: 0.92rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .suggestion-item:hover, 
      .autocomplete-item:hover {
        background: rgba(168, 85, 247, 0.2) !important;
        color: #ffffff;
      }

      /* Ensure search wrapper doesn't clip the dropdown */
      .input-group, .search-container-box {
        position: relative !important;
        overflow: visible !important;
        z-index: 9999 !important;
      }

      /* Floating Autocomplete Dropdown Styling */
      .autocomplete-suggestions-box {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 10000;
        margin-top: 6px;
        background: rgba(18, 24, 38, 0.95);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(168, 85, 247, 0.35);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        max-height: 220px;
        overflow-y: auto;
        padding: 6px 0;
      }

      /* Individual Suggestion Items */
      .suggestion-item {
        padding: 10px 16px;
        color: #f1f5f9;
        font-size: 0.95rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .suggestion-item:hover {
        background: rgba(168, 85, 247, 0.25);
        color: #ffffff;
      }
    </style>
</head>
<body class="py-4 py-md-5">

    <div class="container" style="max-width: 980px;">
        
        <!-- 7-DAY EXTENDED FORECAST HEADER WITH LOCATION SEARCH -->
        <div class="card card-quantum-glass p-4 shadow rounded-4 mb-3">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                <div>
                    <h2 class="fw-bold m-0 d-flex align-items-center gap-2 text-white">
                        <i class="fas fa-calendar-week" style="color: #8b5cf6;"></i>
                        <span>7-Day Extended Forecast</span>
                    </h2>
                    <p class="small m-0 mt-1" style="color: #94a3b8;">
                        Active Location: <strong id="current-location-label" style="color: #22d3ee;">Bengaluru, IN</strong>
                    </p>
                </div>
                <a href="forecast.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fas fa-arrow-left me-1"></i> Dashboard
                </a>
            </div>

            <!-- Search Box Section -->
            <div class="search-container-box" style="position: relative; z-index: 9999; overflow: visible;">
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-purple"><i class="fas fa-map-marker-alt"></i></span>
                <input type="text" 
                       id="forecast-search-input" 
                       class="form-control bg-dark text-light border-secondary" 
                       placeholder="Search city..." 
                       autocomplete="off">
                <button id="update-forecast-btn" class="btn btn-purple">Update Forecast</button>
              </div>
              
              <!-- Suggestions container (will now float on top) -->
              <div id="suggestions-dropdown" class="search-suggestions-dropdown" style="display: none;"></div>
            </div>
        </div>

        <!-- DYNAMIC 7-DAY EXTENDED FORECAST CONTAINER -->
        <div id="forecast-cards-wrapper">
            <div class="text-center py-5" style="color: #64748b;">
                <i class="fas fa-atom fa-spin fa-2x mb-3" style="color: #7209b7;"></i>
                <p>Loading live quantum-corrected forecast...</p>
            </div>
        </div>
    </div>

    <script>
  // Global forecast fetch function with automatic fallback execution
  async function fetch7DayForecast(cityName = "Bengaluru", lat = 12.9716, lon = 77.5946) {
    const forecastContainer = document.getElementById('forecast-cards-container') || document.querySelector('.row.g-4');
    const locationSpan = document.getElementById('active-location-name') || document.querySelector('.text-info');

    if (locationSpan) {
      locationSpan.innerText = `${cityName}`;
    }

    try {
      // 1. Fetch 7-Day Extended Weather & AQI Telemetry from Open-Meteo
      const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,windspeed_10m_max,relative_humidity_2m_max&timezone=auto`;
      const res = await fetch(apiUrl);
      
      if (!res.ok) throw new Error("Weather API request failed");
      const data = await res.json();

      const daily = data.daily;
      if (!daily || !daily.time) throw new Error("Invalid forecast payload received");

      // 2. Clear loading spinner & render cards
      if (forecastContainer) {
        forecastContainer.innerHTML = ''; // Wipe spinner

        daily.time.forEach((dateStr, index) => {
          const maxTemp = Math.round(daily.temperature_2m_max[index] ?? 28);
          const minTemp = Math.round(daily.temperature_2m_min[index] ?? 20);
          const wind = Math.round(daily.windspeed_10m_max[index] ?? 12);
          const hum = Math.round(daily.relative_humidity_2m_max[index] ?? 65);

          // Simulated Quantum AQI logic per day
          const calculatedAqi = Math.round(35 + (maxTemp * 0.4) + (wind * 0.2));
          let statusStr = calculatedAqi <= 50 ? "Good" : calculatedAqi <= 100 ? "Moderate" : "Unhealthy";
          let badgeBg = calculatedAqi <= 50 ? "bg-success" : calculatedAqi <= 100 ? "bg-warning text-dark" : "bg-danger";

          const formattedDate = new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

          const cardHtml = `
            <div class="col-md-4 col-lg-3">
              <div class="card bg-dark text-light border border-secondary border-opacity-25 rounded-4 p-3 shadow-sm h-100">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="fw-bold text-light">${formattedDate}</span>
                  <span class="badge ${badgeBg}">${statusStr}</span>
                </div>
                <div class="my-2 text-center">
                  <h2 class="fw-bold text-purple mb-0">AQI ${calculatedAqi}</h2>
                  <small class="text-secondary">Quantum Forecast</small>
                </div>
                <hr class="border-secondary border-opacity-25 my-2">
                <div class="small text-light-50">
                  <div class="d-flex justify-content-between mb-1">
                    <span><i class="fas fa-temperature-high text-danger me-1"></i> Temp Range</span>
                    <strong>${minTemp}°C - ${maxTemp}°C</strong>
                  </div>
                  <div class="d-flex justify-content-between mb-1">
                    <span><i class="fas fa-wind text-info me-1"></i> Max Wind</span>
                    <strong>${wind} km/h</strong>
                  </div>
                  <div class="d-flex justify-content-between">
                    <span><i class="fas fa-tint text-primary me-1"></i> Max Humidity</span>
                    <strong>${hum}%</strong>
                  </div>
                </div>
              </div>
            </div>
          `;
          forecastContainer.insertAdjacentHTML('beforeend', cardHtml);
        });
      }

    } catch (err) {
      console.error("Error loading forecast details:", err);
      if (forecastContainer) {
        forecastContainer.innerHTML = `
          <div class="col-12 text-center text-danger py-4">
            <i class="fas fa-exclamation-triangle fs-3 mb-2"></i><br>
            Failed to load forecast data. Please check connection and try again.
          </div>
        `;
      }
    }
  }

  // Execute on page DOM load
  document.addEventListener('DOMContentLoaded', () => {
    fetch7DayForecast();

    // Bind Update Forecast Button
    const updateBtn = document.getElementById('update-forecast-btn') || document.querySelector('button');
    const searchInput = document.getElementById('forecast-search-input') || document.querySelector('input[type="text"]');

    const handleSearch = async () => {
      const city = searchInput?.value.trim() || 'Bengaluru';
      try {
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`);
        const geoData = await geoRes.json();
        if (geoData && geoData.length > 0) {
          fetch7DayForecast(geoData[0].display_name.split(',')[0], geoData[0].lat, geoData[0].lon);
        }
      } catch (e) {
        console.error("Search failed:", e);
      }
    };

    if (updateBtn) updateBtn.addEventListener('click', handleSearch);
  });
</script>

</body>
</html>
